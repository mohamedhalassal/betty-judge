on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write
jobs:
  build-and-push-judge-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker judge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file:  ./docker/judge/Dockerfile
          load: true
          tags: |
            judge:test
            ghcr.io/${{ github.repository_owner }}/judge:latest
            ghcr.io/${{ github.repository_owner }}/judge:${{ github.sha }}

      - name: Run judge tests
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:///test.db \
            -e AZURE_QUEUE_CONNECTION_STRING="UseDevelopmentStorage=true" \
            -e AZURE_QUEUE_NAME=quickstartqueuesample \
            judge:test \
            python -m pytest tests/test_judge.py tests/test_queue.py
      - name: Push Docker judge image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/judge:latest
          docker push ghcr.io/${{ github.repository_owner }}/judge:${{ github.sha }}
