name: Backend Docker

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/backend/Dockerfile
          load: true
          tags: betty-backend

      - name: Run backend tests
        run: |
          docker run --rm \
          -e DATABASE_URL=sqlite:///test.db \
          betty-backend \
          uv run pytest tests

      - name: Tag image
        run: |
          docker tag betty-backend ghcr.io/${{ github.repository_owner }}/betty-backend:latest
          docker tag betty-backend ghcr.io/${{ github.repository_owner }}/betty-backend:${{ github.sha }}

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/betty-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/betty-backend:${{ github.sha }}