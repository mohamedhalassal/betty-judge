<!DOCTYPE html>
<html>
<body>
  <script src="https://accounts.google.com/gsi/client" async></script>

  <script>
    function handleCredentialResponse(response) {
      console.log("Google ID token:");
      console.log(response.credential);

      document.getElementById("token").value = response.credential;
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "275603186882-0io5gb0db13qmq5u03kjo5fcr2ac1v8q.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("buttonDiv"),
        { theme: "outline", size: "large" }
      );
    };
  </script>

  <div id="buttonDiv"></div>

  <textarea id="token" style="width: 100%; height: 200px;"></textarea>
</body>
</html>
